name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check .

      - name: Domain static type check
        run: |
          python -m mypy \
            models/schemas.py \
            core/scoring_policy.py \
            core/findings.py \
            agents/scoring_agent.py

  test:
    name: Test & Evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          GEMINI_API_KEY: ""
          OPENFDA_API_KEY: ""
        run: |
          python -m pytest -q \
            --cov=agents \
            --cov=providers \
            --cov=core \
            --cov=models \
            --cov=evaluation \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Run deterministic synthetic evaluation
        env:
          GEMINI_API_KEY: ""
          OPENFDA_API_KEY: ""
        run: python scripts/run_evaluation.py --strict

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  container:
    name: Container Smoke Test
    runs-on: ubuntu-latest
    needs: [quality, test]
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build container
        run: docker build -t polypharm-ai:ci .

      - name: Start container
        run: |
          docker run -d \
            --name polypharm-ai \
            -p 8501:8501 \
            -e GEMINI_API_KEY="" \
            -e OPENFDA_API_KEY="" \
            polypharm-ai:ci

      - name: Wait for Streamlit health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              echo
              echo "Container health check passed."
              exit 0
            fi
            sleep 2
          done

          echo "Container did not become healthy."
          docker logs polypharm-ai
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs polypharm-ai || true
