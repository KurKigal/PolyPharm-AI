name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        env:
          GEMINI_API_KEY: ""
          OPENFDA_API_KEY: ""
        run: python -m pytest -q

      - name: Run deterministic synthetic evaluation
        env:
          GEMINI_API_KEY: ""
          OPENFDA_API_KEY: ""
        run: python scripts/run_evaluation.py --strict
