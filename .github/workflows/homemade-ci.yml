# Managed by Homemade CI/CD
# homemade-project-type: python
# homemade-trigger-branch: "main"
name: Homemade CI/CD
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  quality:
    name: Python pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install selected Python tools
        run: python -m pip install ruff pytest mypy
      - name: Ruff
        run: ruff check .
      - name: Run tests
        run: pytest
      - name: Mypy
        run: mypy .
