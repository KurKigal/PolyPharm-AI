[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    ".pytest_tmp",
    "evaluation/results",
]

[tool.ruff.lint]
# Keep Stage 6 intentionally conservative: correctness-oriented rules are
# enforced now; broader style/modernization rules can be enabled incrementally.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402"]
"scripts/run_evaluation.py" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
pretty = true
show_error_codes = true

[tool.coverage.run]
branch = true
relative_files = true
source = [
    "agents",
    "core",
    "evaluation",
    "models",
    "providers",
]
omit = [
    "*/__init__.py",
    "tests/*",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
